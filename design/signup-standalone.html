<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Syncron — Sign up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  body{margin:0;background:#f4f4f5;font-family:'Inter',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;}
  ::placeholder{color:#a1a1aa}
  .popup{width:400px;height:600px;overflow-y:auto;background:#ffffff;box-shadow:0 0 0 1px #e4e4e7,0 20px 40px rgba(0,0,0,.08);}
  .wrap{padding:26px 22px 18px;display:flex;flex-direction:column;align-items:center;}
  .logo-row{display:flex;align-items:center;gap:8px;margin-bottom:20px;}
  .logo-text{font-weight:700;font-size:16px;color:#0a0a0a;letter-spacing:-0.01em;}
  h1{margin:0 0 5px;font-size:20px;font-weight:700;color:#0a0a0a;letter-spacing:-0.02em;text-align:center;white-space:nowrap;}
  .subtext{margin:0 0 20px;font-size:12.5px;color:#71717a;text-align:center;line-height:1.4;}
  .card{width:100%;border-radius:16px;border:1px solid #ececec;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.03),0 10px 24px -12px rgba(0,0,0,.08);padding:20px;}
  .oauth-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:9px 14px;border-radius:9px;border:1px solid #e4e4e7;background:#fff;color:#18181b;font-size:13px;font-weight:500;cursor:pointer;transition:background .15s ease,border-color .15s ease;}
  .oauth-btn:hover{background:#fafafa;border-color:#d4d4d8;}
  .divider{display:flex;align-items:center;gap:10px;margin:16px 0;}
  .divider .line{flex:1;height:1px;background:#ececec;}
  .divider span{font-size:10px;letter-spacing:.05em;color:#a1a1aa;white-space:nowrap;}
  .field{display:flex;flex-direction:column;gap:12px;}
  label{display:block;font-size:12px;color:#3f3f46;margin-bottom:5px;font-weight:500;}
  input[type=email],input[type=password],input[type=text]{width:100%;padding:9px 12px;border-radius:9px;border:1px solid #e4e4e7;background:#fff;color:#0a0a0a;font-size:13px;outline:none;transition:border-color .15s ease;font-family:inherit;}
  input:focus{border-color:#0a0a0a;box-shadow:0 0 0 3px rgba(10,10,10,.06);}
  .pw-wrap{position:relative;}
  .pw-wrap input{padding-right:40px;}
  .toggle-pw{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:#a1a1aa;font-size:11px;cursor:pointer;padding:4px;font-family:inherit;}
  .toggle-pw:hover{color:#52525b;}
  .primary-btn{margin-top:2px;width:100%;padding:10px 14px;border-radius:6px;border:none;background:linear-gradient(to bottom,#3b82f6,#1d4ed8);color:#fff;font-size:13.5px;font-weight:600;cursor:pointer;text-shadow:0 1px 2px rgba(0,0,0,.2);box-shadow:0 1px 2px rgba(0,0,0,.1),inset 0 1px 0 rgba(255,255,255,.25);transition:box-shadow .2s ease;font-family:inherit;}
  .primary-btn:hover{box-shadow:0 1px 2px rgba(0,0,0,.1),0 3px 8px rgba(30,144,255,.5),inset 0 1px 0 rgba(255,255,255,.25);}
  .footer-link{margin-top:18px;font-size:12.5px;color:#71717a;}
  .footer-link a{color:#2563eb;text-decoration:none;font-weight:600;}
  .footer-link a:hover{text-decoration:underline;}
</style>
</head>
<body>
  <div class="popup">
    <div class="wrap">
      <div class="logo-row">
        <svg width="22" height="22" viewBox="0 0 30 30" fill="none">
          <circle cx="12" cy="15" r="10" stroke="#18181b" stroke-width="2"></circle>
          <circle cx="19" cy="12" r="7" stroke="#18181b" stroke-width="2" fill="#fff"></circle>
          <path d="M17 10.5L21.5 12.5L17 14.5V10.5Z" fill="#18181b"></path>
        </svg>
        <span class="logo-text">Syncron</span>
      </div>

      <h1>Create your account</h1>
      <p class="subtext">Start a watch party in a few seconds.</p>

      <div class="card">
        <button class="oauth-btn">
          <svg width="15" height="15" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8.1 3.1l6-6C34.5 6 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"></path><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 16 18.9 12 24 12c3.1 0 5.9 1.2 8.1 3.1l6-6C34.5 6 29.6 4 24 4c-7.7 0-14.3 4.4-17.7 10.7z"></path><path fill="#4CAF50" d="M24 44c5.5 0 10.4-1.8 14.2-4.9l-6.6-5.6C29.5 35.4 26.9 36 24 36c-5.3 0-9.7-3.1-11.3-7.6l-6.6 5.1C9.6 39.5 16.2 44 24 44z"></path><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-1 3-3.1 5.4-5.7 6.9l6.6 5.6C39.9 37.2 44 31.5 44 24c0-1.3-.1-2.7-.4-3.5z"></path></svg>
          Continue with Google
        </button>

        <div class="divider"><div class="line"></div><span>OR EMAIL</span><div class="line"></div></div>

        <form class="field" onsubmit="return false;">
          <div>
            <label for="name">Full name</label>
            <input id="name" type="text" placeholder="Jane Doe" required>
          </div>
          <div>
            <label for="email">Email address</label>
            <input id="email" type="email" placeholder="you@example.com" required>
          </div>
          <div>
            <label for="password">Password</label>
            <div class="pw-wrap">
              <input id="password" type="password" placeholder="••••••••" required>
              <button type="button" class="toggle-pw" onclick="togglePw()">Show</button>
            </div>
          </div>
          <button type="submit" class="primary-btn">Create account</button>
        </form>
      </div>

      <p class="footer-link">Already have an account? <a href="login-standalone.html">Sign in</a></p>
    </div>
  </div>

<script>
function togglePw(){
  const input = document.getElementById('password');
  const btn = document.querySelector('.toggle-pw');
  const show = input.type === 'password';
  input.type = show ? 'text' : 'password';
  btn.textContent = show ? 'Hide' : 'Show';
}
</script>
</body>
</html>
