port: 7880
bind_addresses:
  - "0.0.0.0"
rtc:
  tcp_port: 7881
  udp_port: 7882
  use_external_ip: false
  # The browser connects through the host's published Docker ports. Advertising
  # the container address makes the RTC session fail after signaling succeeds.
  node_ip: 127.0.0.1
room:
  max_participants: 25
logging:
  level: warn
