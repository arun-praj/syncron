<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Syncron — Set up your profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  body{margin:0;background:#f4f4f5;font-family:'Inter',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;}
  .popup{width:400px;height:600px;overflow-y:auto;background:#ffffff;box-shadow:0 0 0 1px #e4e4e7,0 20px 40px rgba(0,0,0,.08);}
  .wrap{padding:26px 22px 18px;display:flex;flex-direction:column;align-items:center;}
  .logo-row{display:flex;align-items:center;gap:8px;margin-bottom:20px;}
  .logo-text{font-weight:700;font-size:16px;color:#0a0a0a;letter-spacing:-0.01em;}
  h1{margin:0 0 5px;font-size:20px;font-weight:700;color:#0a0a0a;letter-spacing:-0.02em;text-align:center;white-space:nowrap;}
  .subtext{margin:0 0 20px;font-size:12.5px;color:#71717a;text-align:center;line-height:1.4;}
  .card{width:100%;border-radius:16px;border:1px solid #ececec;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.03),0 10px 24px -12px rgba(0,0,0,.08);padding:20px;}

  .avatar-preview-row{display:flex;justify-content:center;margin-bottom:12px;}
  #avatar-preview{width:52px;height:52px;border-radius:50%;background:#f4f4f5;}

  .avatar-label{display:block;font-size:12px;color:#3f3f46;font-weight:500;margin-bottom:6px;}
  .avatar-scroll{max-height:132px;overflow-y:auto;margin-bottom:6px;padding-right:2px;}
  .avatar-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;}
  .avatar-btn{width:100%;max-width:38px;aspect-ratio:1;padding:0;border-radius:50%;cursor:pointer;background:none;border:2px solid transparent;box-sizing:border-box;transition:border-color .15s ease,box-shadow .15s ease;}
  .avatar-btn.selected{border-color:#2563eb;box-shadow:0 0 0 2px #eff6ff;}
  .avatar-btn svg{width:100%;height:100%;border-radius:50%;display:block;}
  .attribution-note{margin:0 0 16px;font-size:10px;color:#a1a1aa;line-height:1.4;}

  label.field-label{display:block;font-size:12px;color:#3f3f46;margin-bottom:5px;font-weight:500;}
  .username-wrap{position:relative;}
  .at-prefix{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:13px;color:#a1a1aa;}
  input#username{width:100%;padding:9px 12px 9px 24px;border-radius:9px;border:1px solid #e4e4e7;background:#fff;color:#0a0a0a;font-size:13px;outline:none;transition:border-color .15s ease;font-family:inherit;}
  input#username.error{border-color:#fca5a5;}
  input#username:focus{border-color:#0a0a0a;box-shadow:0 0 0 3px rgba(10,10,10,.06);}
  #username-msg{margin:5px 0 0;font-size:11px;color:#a1a1aa;}
  #username-msg.error{color:#dc2626;}

  .primary-btn{margin-top:14px;width:100%;padding:10px 14px;border-radius:6px;border:none;background:linear-gradient(to bottom,#3b82f6,#1d4ed8);color:#fff;font-size:13.5px;font-weight:600;cursor:pointer;text-shadow:0 1px 2px rgba(0,0,0,.2);box-shadow:0 1px 2px rgba(0,0,0,.1),inset 0 1px 0 rgba(255,255,255,.25);transition:box-shadow .2s ease,opacity .2s ease;font-family:inherit;}
  .primary-btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:0 1px 2px rgba(0,0,0,.1),inset 0 1px 0 rgba(255,255,255,.25);}
  .primary-btn:not(:disabled):hover{box-shadow:0 1px 2px rgba(0,0,0,.1),0 3px 8px rgba(30,144,255,.5),inset 0 1px 0 rgba(255,255,255,.25);}
</style>
</head>
<body>
  <div class="popup">
    <div class="wrap">
      <div class="logo-row">
        <svg width="22" height="22" viewBox="0 0 30 30" fill="none">
          <circle cx="12" cy="15" r="10" stroke="#18181b" stroke-width="2"></circle>
          <circle cx="19" cy="12" r="7" stroke="#18181b" stroke-width="2" fill="#fff"></circle>
          <path d="M17 10.5L21.5 12.5L17 14.5V10.5Z" fill="#18181b"></path>
        </svg>
        <span class="logo-text">Syncron</span>
      </div>

      <h1>Set up your profile</h1>
      <p class="subtext">Pick an avatar and a username so friends can find you.</p>

      <div class="card">
        <div class="avatar-preview-row"><div id="avatar-preview"></div></div>

        <label class="avatar-label">Choose your avatar</label>
        <div class="avatar-scroll"><div class="avatar-grid" id="avatar-grid"></div></div>
        <p class="attribution-note">Placeholder set for layout only — ships with 30 bundled, licensed avatar PNGs and artist attribution. No avatar is ever fetched at runtime or uploaded.</p>

        <div>
          <label class="field-label" for="username">Username</label>
          <div class="username-wrap">
            <span class="at-prefix">@</span>
            <input id="username" type="text" placeholder="jamie_rivera" maxlength="32" autocomplete="off">
          </div>
          <p id="username-msg">3–32 characters: letters, numbers, underscores, periods.</p>
        </div>

        <button id="continue-btn" class="primary-btn" type="button" disabled>Continue</button>
      </div>
    </div>
  </div>

<script>
  // Static design mock only — no real onboarding call happens here.
  // Real POST /me/onboarding body is {username, avatarId, displayName?}
  // per docs/API-schema.md; avatarId is one of the bundled IDs 1-30 per
  // docs/db-schema.md (never a runtime-fetched URL).

  // 30 self-contained SVG placeholders standing in for the real bundled
  // avatar pack (see docs/frontend-requirements.md: 30 curated PNGs,
  // shipped in the extension bundle, never requested over the network).
  // IDs must stay within packages/protocol's `avatarId` enum ("1"-"30").
  const AVATAR_IDS = Array.from({ length: 30 }, (_, i) => String(i + 1));
  const COLORS = AVATAR_IDS.map((_, i) => `hsl(${Math.round((i * 360) / AVATAR_IDS.length)}, 70%, 65%)`);
  const MOUTHS = [
    '<path d="M8 15 Q12 19 16 15" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round"/>',
    '<path d="M8.5 16 H15.5" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>',
    '<path d="M8.5 15.5 Q12 17 15 14.5" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round"/>',
    '<circle cx="12" cy="16" r="2" stroke="#fff" stroke-width="1.6" fill="none"/>'
  ];

  function avatarSvg(id){
    const i = Number(id) - 1;
    const color = COLORS[i % COLORS.length];
    const mouth = MOUTHS[i % MOUTHS.length];
    return `<svg viewBox="0 0 24 24" style="background:${color}">
      <circle cx="8" cy="10" r="1.6" fill="#fff"/>
      <circle cx="16" cy="10" r="1.6" fill="#fff"/>
      ${mouth}
    </svg>`;
  }

  let selectedId = AVATAR_IDS[Math.floor(Math.random() * AVATAR_IDS.length)];

  const grid = document.getElementById('avatar-grid');
  const preview = document.getElementById('avatar-preview');
  const usernameInput = document.getElementById('username');
  const usernameMsg = document.getElementById('username-msg');
  const continueBtn = document.getElementById('continue-btn');

  function renderAvatars(){
    grid.innerHTML = '';
    AVATAR_IDS.forEach((id) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'avatar-btn' + (id === selectedId ? ' selected' : '');
      btn.setAttribute('aria-label', `Avatar ${id}`);
      btn.innerHTML = avatarSvg(id);
      btn.addEventListener('click', () => { selectedId = id; renderAvatars(); updatePreview(); });
      grid.appendChild(btn);
    });
  }
  function updatePreview(){ preview.innerHTML = avatarSvg(selectedId); }

  // Mirrors packages/validation's `username` Zod schema (min 3, max 32,
  // ^[a-z0-9_][a-z0-9_.]*[a-z0-9_]$, reserved-name refine). The real React
  // screen should import that schema directly rather than re-checking
  // these rules by hand (CLAUDE.md: don't duplicate protocol types).
  const RESERVED = new Set(['admin', 'support', 'syncron']);
  const USERNAME_RE = /^[a-z0-9_][a-z0-9_.]*[a-z0-9_]$/;
  const DEFAULT_MSG = '3–32 characters: letters, numbers, underscores, periods.';

  function validateUsername(raw){
    const value = raw.trim().toLowerCase();
    if (!value) return 'Username is required.';
    if (value.length < 3) return 'Must be at least 3 characters.';
    if (value.length > 32) return 'Must be 32 characters or fewer.';
    if (!USERNAME_RE.test(value)) return "Letters, numbers, underscores, periods — can't start/end with a period.";
    if (RESERVED.has(value)) return 'That username is taken.';
    return '';
  }

  usernameInput.addEventListener('input', () => {
    usernameInput.value = usernameInput.value.toLowerCase().replace(/[^a-z0-9_.]/g, '');
    const error = validateUsername(usernameInput.value);
    usernameInput.classList.toggle('error', !!error);
    usernameMsg.textContent = error || DEFAULT_MSG;
    usernameMsg.classList.toggle('error', !!error);
    continueBtn.disabled = !!error;
  });

  continueBtn.addEventListener('click', () => {
    if (validateUsername(usernameInput.value)) return;
    // proceed to home screen
  });

  renderAvatars();
  updatePreview();
</script>
</body>
</html>
