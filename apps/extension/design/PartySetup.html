<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>body{margin:0;background:#fff;}</style>
</helmet>
<div style="width:400px;height:600px;position:relative;overflow-y:auto;overflow-x:hidden;background:#ffffff;font-family:'Inter',sans-serif;box-sizing:border-box;display:flex;flex-direction:column;">
  <div style="display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid #ececec;flex-shrink:0;">
    <a href="Home.dc.html" style="display:flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:8px;color:#3f3f46;text-decoration:none;" style-hover="background:#f4f4f5;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </a>
    <span style="font-weight:700;font-size:14px;color:#0a0a0a;letter-spacing:-0.01em;">Start a watch party</span>
  </div>

  <div style="padding:16px 18px 6px;flex-shrink:0;display:flex;align-items:center;gap:10px;">
    <div style="width:34px;height:34px;border-radius:9px;background:#FF0000;color:#fff;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;">Y</div>
    <div style="min-width:0;">
      <div style="font-size:13px;font-weight:600;color:#0a0a0a;letter-spacing:-0.005em;">YouTube detected</div>
      <div style="font-size:11.5px;color:#a1a1aa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">{{ videoTitle }}</div>
    </div>
  </div>

  <div style="padding:18px 18px 20px;flex:1;">
    <div style="font-size:11px;font-weight:500;color:#a1a1aa;letter-spacing:0.05em;text-transform:uppercase;margin-bottom:10px;padding:0 2px;">Party permissions</div>

    <div style="display:flex;align-items:flex-start;gap:12px;padding:14px;border-radius:12px;border:1px solid #ececec;">
      <div style="width:36px;height:36px;border-radius:9px;background:#eff6ff;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M8 5V19L19 12L8 5Z" fill="#2563eb"></path></svg>
      </div>
      <div style="flex:1;min-width:0;">
        <div style="font-size:13.5px;font-weight:600;color:#0a0a0a;letter-spacing:-0.005em;">Let members control playback</div>
        <p style="margin:3px 0 0;font-size:12px;color:#737373;line-height:1.5;">Anyone in the room can play, pause, seek, and mute for everyone.</p>
      </div>
      <button type="button" onClick="{{ toggleControl }}" style="width:38px;height:22px;border-radius:11px;border:none;flex-shrink:0;cursor:pointer;position:relative;transition:background 0.15s ease;background:{{ toggleBg }};margin-top:2px;">
        <span style="position:absolute;top:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,0.2);transition:left 0.15s ease;left:{{ toggleKnobLeft }};"></span>
      </button>
    </div>

    <p style="margin:10px 0 0;font-size:11.5px;color:#a1a1aa;line-height:1.5;padding:0 2px;">Off by default — only you control playback until you turn this on.</p>

    <button type="button" onClick="{{ startParty }}" style="display:flex;align-items:center;justify-content:center;gap:8px;width:100%;box-sizing:border-box;padding:11px 14px;border-radius:6px;border:none;cursor:pointer;color:#ffffff;font-size:13.5px;font-weight:600;text-shadow:0 1px 2px rgba(0,0,0,0.2);background:linear-gradient(to bottom,#3b82f6,#1d4ed8);box-shadow:0 1px 2px rgba(0,0,0,0.1),inset 0 1px 0 rgba(255,255,255,0.25);margin-top:20px;" style-hover="box-shadow:0 1px 2px rgba(0,0,0,0.1),0 3px 8px rgba(30,144,255,0.5),inset 0 1px 0 rgba(255,255,255,0.25);">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="7" cy="8" r="3" stroke="#ffffff" stroke-width="2"></circle><path d="M2 20c0-2.8 2.2-5 5-5s5 2.2 5 5" stroke="#ffffff" stroke-width="2" stroke-linecap="round"></path><circle cx="17" cy="8" r="3" stroke="#ffffff" stroke-width="2"></circle><path d="M12.5 15.2c.5-.1 1-.2 1.5-.2c2.8 0 5 2.2 5 5" stroke="#ffffff" stroke-width="2" stroke-linecap="round"></path></svg>
      Start watch party
    </button>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:400,&quot;height&quot;:600}}">
class Component extends DCLogic {
  state = { allowControl: false, videoTitle: 'Now playing on this tab' };

  toggleControl = () => this.setState(s => ({ allowControl: !s.allowControl }));
  startParty = () => { window.location.href = 'Home.dc.html'; };

  renderVals() {
    const { allowControl, videoTitle } = this.state;
    return {
      videoTitle,
      toggleControl: this.toggleControl,
      startParty: this.startParty,
      toggleBg: allowControl ? '#2563eb' : '#d4d4d8',
      toggleKnobLeft: allowControl ? '18px' : '2px'
    };
  }
}
</script>
</body>
</html>
